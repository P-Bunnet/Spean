<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f27"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#3f3f46" stroke-width="6"/>

  <!-- water line -->
  <path d="M200 700 q40 -24 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#27272a" stroke-width="18" stroke-linecap="round"/>

  <!-- bridge deck -->
  <path d="M176 560 H848" stroke="#e4e4e7" stroke-width="34" stroke-linecap="round"/>

  <!-- suspension arc: the hop chain -->
  <path d="M208 560 C300 300, 724 300, 816 560" fill="none" stroke="url(#arc)" stroke-width="44" stroke-linecap="round"/>

  <!-- hangers -->
  <g stroke="#a1a1aa" stroke-width="14" stroke-linecap="round">
    <line x1="352" y1="404" x2="352" y2="560"/>
    <line x1="512" y1="368" x2="512" y2="560"/>
    <line x1="672" y1="404" x2="672" y2="560"/>
  </g>

  <!-- hop nodes -->
  <g fill="#18181b" stroke="#e4e4e7" stroke-width="18">
    <circle cx="208" cy="560" r="44"/>
    <circle cx="352" cy="404" r="36"/>
    <circle cx="512" cy="368" r="36"/>
    <circle cx="672" cy="404" r="36"/>
    <circle cx="816" cy="560" r="44"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="208" cy="560" r="16"/>
    <circle cx="816" cy="560" r="16"/>
  </g>
</svg>
