name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet ./... && go test ./...
      - run: cd frontend && npm ci && npx tsc -b && npx vite build

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: build/bin/spean.app
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: build/bin/spean
          - os: windows-latest
            platform: windows/amd64
            artifact: build/bin/spean.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: cd frontend && npm ci
      - run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41
        if: runner.os == 'Linux'
      - run: wails build -clean -platform ${{ matrix.platform }}
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: spean-${{ matrix.platform == 'darwin/universal' && 'macos' || runner.os == 'Linux' && 'linux' || 'windows' }}
          path: ${{ matrix.artifact }}
